spring:
  application:
    name: blog-test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1oMi10ZXN0LW9ubHktMzJieXRlcw==
  access-expiration: 900000
  refresh-expiration: 604800000

logging:
  level:
    root: WARN
    com.study.blog: INFO
