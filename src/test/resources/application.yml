spring:
  application:
    name: blog-test
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

  cloud:
    aws:
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key
      region:
        static: ap-northeast-2
      s3:
        bucket:
          event: test-event-bucket
          session: test-session-bucket
        presigned-url-expiration: 180

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1oMi10ZXN0LW9ubHktMzJieXRlcw==
  access-expiration: 900000
  refresh-expiration: 604800000

logging:
  level:
    root: WARN
    com.study.blog: INFO
