spring:
  application:
    name: study-be

  # === 데이터베이스 연결 ===
  # 접속 정보는 프로젝트 루트의 .env 파일에서 읽어옴 (spring-dotenv)
  # .env 파일은 .gitignore에 포함되어 레포에 올라가지 않음
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    # === 커넥션 풀 (HikariCP) ===
    # DB 커넥션을 미리 만들어두고 재사용하는 설정
    # RDS t4g.micro (vCPU 2, 메모리 1GB) 기준으로 튜닝
    hikari:
      maximum-pool-size: 10      # 최대 커넥션 수. vCPU 2개 기준 10개면 넉넉
      minimum-idle: 10           # 최소 유지 커넥션 = 최대와 같게 → 고정 풀 (HikariCP 권장)
      max-lifetime: 1800000      # 30분마다 커넥션을 새로 만듦 (오래된 커넥션 문제 방지)
      keepalive-time: 30000      # 30초마다 커넥션이 살아있는지 헬스체크
      connection-timeout: 3000   # 3초 안에 커넥션 못 잡으면 에러 (기본 30초는 너무 김)

  # === JPA (Java Persistence API) ===
  # Java 엔티티 클래스 ↔ DB 테이블 자동 매핑
  jpa:
    hibernate:
      # 스키마는 Flyway가 관리. Hibernate는 엔티티와 DB가 일치하는지 검증만 함
      # 불일치 시 앱 시작 실패 → DDL 누락을 즉시 발견할 수 있음
      ddl-auto: validate
    # OSIV 끔 — Controller에서 지연 로딩 못 하게 막음
    # 켜두면 편하지만 DB 커넥션을 뷰 렌더링까지 물고 있어서 성능 문제 생김
    open-in-view: false
    properties:
      hibernate:
        format_sql: true         # SQL을 보기 좋게 줄바꿈 (한 줄 쿼리 → 포맷팅)

# === AWS S3 ===

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ${AWS_REGION}

      s3:
        bucket:
          event: ${S3_BUCKET_EVENT}       # 이벤트 게시글 이미지 버킷
          session: ${S3_BUCKET_SESSION}   # 세션보드 이미지 버킷
        presigned-url-expiration: ${S3_PRESIGNED_URL_EXPIRATION:180}  # 초 단위, 기본 3분
        upload:
          max-file-size-bytes: 10485760   # 10MB
          allowed-extensions:
            - jpg
            - jpeg
            - png
            - gif
            - webp
          max-files-per-request: 10

# === JWT 인증 ===
# JWT_SECRET은 반드시 Base64 인코딩된 256bit 이상 키여야 한다
# 생성: openssl rand -base64 32
jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}      # 15분 (ms). 짧을수록 탈취 피해 감소
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7일 (ms). rotation으로 보완

# === 로깅 ===
logging:
  level:
    org.hibernate.SQL: warn
    org.springframework.security: warn
